# =============================================================================
# Complicidad — Docker Compose
#
# Starts PostgreSQL 16, the API server, and the Next.js frontend.
#
# Origins:
#   - Browser frontend origin: http://localhost:3001 (CORS_ALLOWED in API)
#   - Server-to-server API calls: http://api:3000 (Docker internal DNS)
#
# Usage:
#   cp .env.example .env        # edit vars as needed
#   docker compose up -d        # start all services
#   docker compose logs -f api  # watch API logs
#   docker compose down         # stop and remove containers
#   docker compose down -v      # also delete the DB volume
# =============================================================================

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: complicidad
      POSTGRES_USER: complicidad
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sWhBh0V0FdkYxCP5}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complicidad"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complicidad
      DB_USER: complicidad
      DB_PASSWORD: ${DB_PASSWORD:-sWhBh0V0FdkYxCP5}
      DB_SYNC: "true"
    command: ["npm", "run", "dev"]
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./package.json:/app/package.json:ro
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ../complicidad-APP
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Server-to-server: uses Docker internal service DNS
      API_BASE_URL: http://api:3000
      FRONTEND_ORIGIN: http://localhost:3001
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
